databaseChangeLog:
  - changeSet:
      id: 001-create-classes
      author: assignitdone
      changes:
        - createTable:
            tableName: classes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
