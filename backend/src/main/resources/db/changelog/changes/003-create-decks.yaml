databaseChangeLog:
  - changeSet:
      id: 003-create-decks
      author: assignitdone
      changes:
        - createTable:
            tableName: decks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: class_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_decks_class
                    references: classes(id)
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
