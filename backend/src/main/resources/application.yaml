spring:
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: backend
  datasource:
    # Data is held in memory and resets when the application process restarts.
    url: jdbc:h2:mem:assignitdone;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  ai:
    # Enable chat with the ai profile after configuring Ollama Cloud credentials.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

app:
  api:
    title: AssignItDone API
    description: REST API for the AssignItDone assignment and study application.
    version: 0.0.1

springdoc:
  api-docs:
    path: /v3/api-docs
