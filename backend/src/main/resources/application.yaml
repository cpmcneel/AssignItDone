spring:
  application:
    name: backend
  datasource:
    # Data is held in memory and resets when the application process restarts.
    url: jdbc:h2:mem:assignitdone;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

app:
  api:
    title: AssignItDone API
    description: REST API for the AssignItDone assignment and study application.
    version: 0.0.1

springdoc:
  api-docs:
    path: /v3/api-docs
